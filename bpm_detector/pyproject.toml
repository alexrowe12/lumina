[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bpm-detector"
version = "0.1.0"
description = "CLI tool for detecting BPM and beat timestamps from WAV files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
bpm-detector = "bpm_detector.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

